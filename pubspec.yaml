name: gravita
description: "Gravita — Skills & Strength. Kamera-tabanlı kuvvet ve beceri antrenmanı, cihazda."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Motor AYRI paket ve Flutter bağımlılığı YOK (M-F-160, JabLab/Choreia
  # yerleşim aynası): ölçüm/hüküm mantığı widget ağacı olmadan test edilebilir
  # kalmalı, kabuk da motora yandan uzanamamalı.
  gravita_engine:
    path: packages/gravita_engine

  # SessionStore ÇEKİRDEĞE TERFİ ETTİ (0.9.0, M-F-193) ve kabuk `SessionRecord`
  # tipini DOĞRUDAN kullanıyor → burada BİLDİRİLMEK zorunda. Transitif bir
  # paketten tip almak (`depend_on_referenced_packages`) bağımlılığı görünmez
  # kılar: motor yarın çekirdeği bıraksa kabuk sessizce kırılırdı.
  #
  # ⚠️ PİN EŞİTLİĞİ: bu ref, `packages/gravita_engine`in ref'iyle AYNI olmak
  # ZORUNDA — farklı ref'ler pub'a aynı paket için iki kaynak gösterir
  # (JabLab J-071 bulgusu). `test/shell_contract_test.dart` eşitliği zorluyor.
  # Kamera köprüsü (`motion_camera`) bağlanınca TAM-40-SHA zeyli gelecek;
  # bugün kamera KAPSAM DIŞI, o yüzden sahte pin yazmıyorum.
  motion_core:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_core
      ref: motion_core-v0.10.0

  # YALNIZ uygulama-özel dizini bulmak için. Depolama BİÇİMİ motorda
  # (`JsonlSessionStore`, append-only JSONL) ve kurucusu bir `File` alıyor —
  # `path_provider` KABLOLAMA katmanında kalıyor. Bu ayrım terfi-arayüzünün
  # 1. şartı (Choreia'nın "port yapılamaz" hükmü tam bunu görmediği için
  # verilmişti). 3. taraf DB BİLEREK YOK: sorgu ihtiyacı ÖLÇÜLÜNCE gelir (J-064).
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  # `test/shell_contract_test.dart` pubspec'i ve motor pubspec'ini OKUYOR
  # (paketleme + pin nöbetleri). Regex'le yaml ayrıştırmak yerine ayrıştırıcı
  # kullanıyoruz: nöbetin kendisi kırılgan olmasın.
  yaml: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    # İçerik çalışma-zamanında yorumlanan sürümlü JSON'dur (ADR-004):
    # yeni hareket = yeni JSON, kod değişmez.
    - content/library.json
    # Katalog DALGA DALGA listelenir. Dizinler ELLE yazılıyor çünkü
    # `content/catalog/` kökünde `exclusions.json` var ve o bir DERLEME
    # defteridir — çalışma-zamanı okuyucusu YOK, uygulamaya girmemeli.
    # ⚠️ W3 eklenirse buraya SATIR EKLENECEK; unutulursa yükleme GÜRÜLTÜLÜ
    # patlar (tercih edilen arıza yönü) ve `test/content_assets_test.dart`
    # bunu zaten önce yakalar.
    - content/catalog/w1/
    - content/catalog/w2/
    # ⚠️ `content/harvest/` BİLEREK YOK. 18 dosyanın 16'sı derleme defteri
    # (`decisions.bodyweight_squat.json` HÜKÜM kaydı, `queue.*.json`,
    # sonda çıktıları). Dizin olarak eklemek hepsini uygulamaya sokardı.
    # Referans artefaktları (`reference.push_up.json`,
    # `reference.bodyweight_squat.json`) da HENÜZ eklenmedi: bu kabukta onları
    # OKUYAN kod yok. Gecenin dersi tam buydu — "beyan var, okuyanı yok";
    # okuyucu geldiği gün satırı da gelir.
