name: gravita
description: "Gravita — Skills & Strength. Kamera-tabanlı kuvvet ve beceri antrenmanı, cihazda."
publish_to: none
version: 1.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  supabase_flutter: 2.17.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared Motion account uses the same immutable revision as core and camera.
  motion_account:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_account
      ref: edeec10a161c76bfa086b1d165d53e46ec88c3d7

  # Motor AYRI paket ve Flutter bağımlılığı YOK (M-F-160, JabLab/Choreia
  # yerleşim aynası): ölçüm/hüküm mantığı widget ağacı olmadan test edilebilir
  # kalmalı, kabuk da motora yandan uzanamamalı.
  gravita_engine:
    path: packages/gravita_engine

  # SessionStore ÇEKİRDEĞE TERFİ ETTİ (0.9.0, M-F-193) ve kabuk `SessionRecord`
  # tipini DOĞRUDAN kullanıyor → burada BİLDİRİLMEK zorunda. Transitif bir
  # paketten tip almak (`depend_on_referenced_packages`) bağımlılığı görünmez
  # kılar: motor yarın çekirdeği bıraksa kabuk sessizce kırılırdı.
  #
  # ⚠️ PİN EŞİTLİĞİ: bu ref, `packages/gravita_engine`in ref'iyle AYNI olmak
  # ZORUNDA — farklı ref'ler pub'a aynı paket için iki kaynak gösterir
  # (JabLab J-071 bulgusu). `test/shell_contract_test.dart` eşitliği zorluyor.
  # ⚠️ PİN TAG DEĞİL TAM-40-SHA (J-071 bulgusu, M-F-154 zeyli): plugin
  # `motion_core`u PATH ile çekiyor; pub onun transitif core'unu ÇÖZÜLMÜŞ
  # SHA, buradaki pini TAG ADI olarak görür ve aynı commit olsalar bile
  # descriptor'ları FARKLI sayar ("incompatible with ... from path").
  # Onaylı ref `f2ea161c` hesap/üyelik, core ve kamera paketlerini birlikte
  # taşır; aşağıdaki iki doğrudan pin aynı tam commit'i kullanır.
  motion_core:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_core
      ref: edeec10a161c76bfa086b1d165d53e46ec88c3d7
  # Bundled course bytes share the immutable Core revision. This reader bridge
  # does not declare a production media manifest or enable delivery.
  motion_content:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_content
      ref: edeec10a161c76bfa086b1d165d53e46ec88c3d7

  # Packaged, offline lesson demonstrations. The shipping media catalog is
  # empty until a separately accepted media package is produced.
  video_player: ^2.11.1
  # KAMERA KÖPRÜSÜ (M-F-263). Pin motion_core ile AYNI commit olmak ZORUNDA
  # — `shell_contract_test` eşitliği zorluyor (eski "motion_camera YOK"
  # nöbeti bu teste DÖNÜŞTÜ, silinmedi).
  motion_camera:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_camera
      ref: edeec10a161c76bfa086b1d165d53e46ec88c3d7
  # Kamera izni: reddedilme DÜRÜST bir hâldir, sessizce boş ekran değil.
  permission_handler: ^12.0.3

  # YALNIZ uygulama-özel dizini bulmak için. Depolama BİÇİMİ motorda
  # (`JsonlSessionStore`, append-only JSONL) ve kurucusu bir `File` alıyor —
  # `path_provider` KABLOLAMA katmanında kalıyor. Bu ayrım terfi-arayüzünün
  # 1. şartı (Choreia'nın "port yapılamaz" hükmü tam bunu görmediği için
  # verilmişti).
  #
  # ⚠️ "3. taraf DB BİLEREK YOK: sorgu ihtiyacı ÖLÇÜLÜNCE gelir (J-064)" —
  # bu satır BURADA duruyordu ve GRA-P1-004 Step 3-5 açılana kadar doğruydu.
  # J-064'ün kendi kapsamı SORGU HIZI (JSONL'in linear-scan'i bir sorun
  # olsaydı erken bir DB'ye kaçış olurdu) — DEĞİŞEN şey sorgu hızı DEĞİL,
  # roadmap'in artık İSTEDİĞİ ATOMİK yetenek: aynı anda export/delete + göç
  # + entitlement-cache. `02-MOTION-AILESI-ORKESTRASYON.md` §8.1 (kurucu-onaylı
  # aile planı, `packages/motion_store/` bunu `motion_core`nun ÜSTÜNDE ayrı bir
  # paket olarak tanımlıyor, §6.2) net: JSONL journal PROVENANCE kaynağı olarak
  # KALIYOR (DEĞİŞMEDİ), Drift onun YENİDEN-KURULABİLİR bir İZDÜŞÜMÜ —
  # `motion_store` henüz inşa edilmediği için (SERT KURAL: eksik ortak paket
  # → app-içi çöz) burada, Gravita'nın kendi `lib/app/storage/`ında kuruluyor.
  path_provider: ^2.1.0

  # Session-index/plan/progress PROJEKSİYONU (GRA-P1-004 Step 3, yukarıdaki
  # notla AYNI gerekçe). JSONL journal'ın YERİNE değil, ÜSTÜNDE — journal
  # HER ZAMAN gerçeğin kaynağı, bu tablo `session_projector.dart`ın journal'ı
  # yeniden-oynatarak KURDUĞU/yeniden-kurabileceği bir ÖNBELLEK.
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  # `test/shell_contract_test.dart` pubspec'i ve motor pubspec'ini OKUYOR
  # (paketleme + pin nöbetleri). Regex'le yaml ayrıştırmak yerine ayrıştırıcı
  # kullanıyoruz: nöbetin kendisi kırılgan olmasın.
  yaml: ^3.1.0
  # `test/onboarding_launch_path_test.dart` açılış yolunu GERÇEK
  # `OnboardingStore.open()` üzerinden koşturuyor; tek sahtelenen şey uygulama
  # destek DİZİNİ. Transitif olarak zaten çözülüyordu ama BURADA BİLDİRİLİYOR:
  # doğrudan tip kullanan bir paketi bildirmemek bağımlılığı görünmez kılar
  # (yukarıdaki `motion_core` notunun aynı kuralı).
  path_provider_platform_interface: ^2.1.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    # İçerik çalışma-zamanında yorumlanan sürümlü JSON'dur (ADR-004):
    # yeni hareket = yeni JSON, kod değişmez.
    - content/library.json
    # "Neden yok?" sayfasının KULLANICI altkümesi — `tools/build_exclusions_page.py`
    # ile `content/catalog/exclusions.json`'dan ÜRETİLİR. Kaynağın kendisi
    # PAKETLENMEZ: içinde `internalRule_tr` (Türkçe iç kural) ve `reconsiderIf`
    # (yol haritası dili) var, ikisi de kullanıcı metni değil.
    # ⚠️ Aşağıdaki `harvest` yorumunun kuralı burada İŞLEDİ: "okuyucu geldiği
    # gün satırı da gelir" — okuyucu bugün geldi (LibraryScreen/WhyNotHere).
    - content/exclusions.page.json
    # Beceri ağacı ÖZETİ — `tools/build_skill_tree_index.py`. Paketlerin
    # kendisi (`content/skill-graph/`) PAKETLENMEZ: `nodes[]` doğrulanmamış
    # eşik değerleri taşıyor (`status: DRAFT`) ve onları uygulamaya sokmak,
    # ölçülmemiş bir sayıyı kapı gibi çizmeye davet olurdu. İndeks yalnız
    # "ne var, hangi durumda" der.
    - content/skill-trees.index.json
    # Katalog DALGA DALGA listelenir. Dizinler ELLE yazılıyor çünkü
    # `content/catalog/` kökünde `exclusions.json` var ve o bir DERLEME
    # defteridir — çalışma-zamanı okuyucusu YOK, uygulamaya girmemeli.
    # ⚠️ W3 eklenirse buraya SATIR EKLENECEK; unutulursa yükleme GÜRÜLTÜLÜ
    # patlar (tercih edilen arıza yönü) ve `test/content_assets_test.dart`
    # bunu zaten önce yakalar.
    - content/catalog/w1/
    - content/catalog/w2/
    # Sekiz haftalık program periyotlama PARAMETRELERİ (GRA-P1-003) — hareket
    # SEÇMEZ, yalnız set/tekrar/deload sayıları taşır (bkz. dosyanın kendi
    # $comment'ı). Skill-graph'ın AKSİNE: burada gizlenecek doğrulanmamış
    # eşik yok, ve OKUYUCU (`content_repository.dart::loadProgramConfig`)
    # ARTIK var — "beyan var, okuyanı yok" satırı bu turda kapandı.
    - content/programs/foundation.v1.json
    - content/courses/calisthenics.v1.json
    - content/courses/dbkb-written.v1.json
    - content/courses/dbkb-transitions.v1.json
    - content/motion_content/dbkb-transitions.manifest.json
    - content/courses/dbkb-handling.v1.json
    - content/motion_content/dbkb-handling.manifest.json
    - content/motion_content/dbkb-written.manifest.json
    # App-owned v2l source identities. These contain production briefs and one
    # explicit equipment HOLD; they contain no MP4/VTT or playable media.
    - content/courses/gravita.source-slice.v1.json
    - content/courses/gravita.source-projection.v1.json
    # Course-JSON byte integrity only. This is not a video or model catalogue.
    - content/motion_content/manifest.json
    # Poz modeli — git'te DEĞİL (aile kuralı, .gitignore); `tool/fetch_pose_model.sh`
    # indirir ve SHA-256 DOĞRULAR. Asset olarak paketlenir, çalışma-zamanında
    # dosyaya yazılır (plugin dosya yolu ister, bundle değil).
    - assets/models/
    # ⚠️ `content/harvest/` BİLEREK YOK. 18 dosyanın 16'sı derleme defteri
    # (`decisions.bodyweight_squat.json` HÜKÜM kaydı, `queue.*.json`,
    # sonda çıktıları). Dizin olarak eklemek hepsini uygulamaya sokardı.
    # Referans artefaktları (`reference.push_up.json`,
    # `reference.bodyweight_squat.json`) da HENÜZ eklenmedi: bu kabukta onları
    # OKUYAN kod yok. Gecenin dersi tam buydu — "beyan var, okuyanı yok";
    # okuyucu geldiği gün satırı da gelir.
    #
    # Font lisansları (F2, 2026-08-16) — OFL 1.1 metinleri PAKETİN İÇİNDE,
    # `fonts:` bildirimi aşağıda .ttf'leri ayrıca bundle eder.
    - assets/fonts/PublicSans/OFL.txt
    - assets/fonts/RobotoMono/OFL.txt
  fonts:
    # Tasarım paneli tipografisi (Public Sans + Roboto Mono) — F2 (D1,
    # 2026-08-16): önceden `google_fonts` ile ÇALIŞMA ANINDA
    # `fonts.gstatic.com`dan çekiliyordu (B5 blokajı — ağ reddinde soğuk
    # açılış düşüyordu, testte/sim'de bu makinenin google_fonts önbelleğine
    # bağımlıydı). Artık PAKETLİ: OFL 1.1, ikisi de DEĞİŞKEN font (Google'ın
    # üst akış deposunda yalnız `[wght]` biçimi var, statik alt-küme YOK) —
    # tek dosya `wght` ekseniyle tüm ağırlıkları taşır. Ağırlıklar ÖLÇÜLENLE
    # birebir (`grep -rohn 'FontWeight\.w[0-9]\+' lib/`): Public Sans
    # 400/500/600, Roboto Mono 500/600 — yeni bir ağırlık koda girerse bu
    # listeye de eklenmeli, yoksa en yakın bildirilen ağırlığa sessizce düşer.
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans/PublicSans[wght].ttf
          weight: 400
        - asset: assets/fonts/PublicSans/PublicSans[wght].ttf
          weight: 500
        - asset: assets/fonts/PublicSans/PublicSans[wght].ttf
          weight: 600
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono/RobotoMono[wght].ttf
          weight: 500
        - asset: assets/fonts/RobotoMono/RobotoMono[wght].ttf
          weight: 600
